name: PR Automation

on:
  pull_request:
    types:
      - opened
      - reopened

permissions:
  pull-requests: write
  issues: write

jobs:
  assign-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Assign PR to dustin-lennon
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const branch = pr.head.ref;

            // Always assign to dustin-lennon
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              assignees: ['dustin-lennon']
            });

            // Parse issue number from branch name: feature/N-name or hotfix/N-name
            const issueMatch = branch.match(/(?:feature|hotfix)\/(\d+)-/);

            if (issueMatch) {
              const issueNumber = parseInt(issueMatch[1], 10);

              try {
                // Fetch the linked issue to get its milestone and labels
                const issue = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber
                });

                // Copy milestone from issue → PR
                if (issue.data.milestone) {
                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    milestone: issue.data.milestone.number
                  });
                  console.log(`✓ Milestone set to ${issue.data.milestone.title} (from issue #${issueNumber})`);
                }

                // Copy labels from issue → PR
                if (issue.data.labels.length > 0) {
                  const labelNames = issue.data.labels.map(l => l.name);
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    labels: labelNames
                  });
                  console.log(`✓ Labels copied: ${labelNames.join(', ')}`);
                }

                console.log(`✓ Assigned dustin-lennon, synced from issue #${issueNumber}`);
              } catch (e) {
                console.log(`⚠ Issue #${issueNumber} not found, skipping milestone/label sync`);
              }
            } else {
              // No issue number in branch — apply default label
              const label = branch.startsWith('hotfix/') ? 'bug' : 'enhancement';
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: [label]
              });
              console.log(`✓ Assigned dustin-lennon, label: ${label} (no issue number in branch)`);
            }
